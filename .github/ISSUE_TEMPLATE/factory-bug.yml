name: Bug
description: Something behaves differently from its specification. Same format as a feature, so the factory can plan, fix, verify and ship it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Say what happens and what should happen, in a few lines. The planner turns this into a spec and asks you about the rest before anything is fixed. Short is fine.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, what you expected, and how to reproduce it. A few lines.
      placeholder: |
        Observed: ...
        Expected: ...
        Steps: 1. ... 2. ... 3. ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true when it is fixed, in your own words. One to three lines; the spec makes them precise and testable.
      placeholder: |
        - Doing ... now gives ... instead of ...
        - Everything else still works as before.
      value: |
        - 
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already made (no clarification needed)
      description: Anything you already know for sure, so the planner does not ask about it. Write "none" if you have not decided anything yet. For an unattended run, decide everything here.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which part of the app this touches, and what it explicitly does not. One or two lines.
    validations:
      required: true
