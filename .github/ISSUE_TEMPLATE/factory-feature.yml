name: Feature
description: A small change the factory can plan, build, verify and ship from this issue. One issue is one feature directory and one pull request.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write down what you already know, in a few lines. The planner turns this into a spec and asks you about the rest before anything is built. Short is fine.
  - type: textarea
    id: story
    attributes:
      label: Story
      description: Who wants what, and why. One or two sentences.
      placeholder: As a <user> I want <capability>, so that <outcome>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true when it is done, in your own words. Two to five lines is enough; the spec makes them precise and testable.
      placeholder: |
        - The app shows ... when ...
        - Everything else still works as before, also on a phone screen.
      value: |
        - 
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already made (no clarification needed)
      description: Anything you already know for sure, so the planner does not ask about it. Write "none" if you have not decided anything yet. For an unattended run, decide everything here.
      placeholder: |
        - No new dependencies. No functional changes.
        - Dark theme only.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which part of the app this touches, and what it explicitly does not. One or two lines.
      placeholder: |
        - The editor only.
        - Out of scope: new pages, copy changes.
    validations:
      required: true
